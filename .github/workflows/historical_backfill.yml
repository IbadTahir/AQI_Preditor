name: Historical AQI Backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First date to backfill (YYYY-MM-DD)"
        required: true
        default: "2026-08-06"
      end_date:
        description: "Last date to backfill (YYYY-MM-DD)"
        required: true
        default: "2026-08-21"

jobs:
  historical-backfill:
    runs-on: ubuntu-latest
    env:
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Backfill historical data
        run: >-
          python historical_backfill.py
          --start "${{ inputs.start_date }}"
          --end "${{ inputs.end_date }}"